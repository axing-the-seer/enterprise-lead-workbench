<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI",
          sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 36px;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      .header {
        text-align: center;
        padding: 10px 0;
      }
      .header h2 {
        margin: 0;
        color: #1d1d1f;
      }
      .content {
        padding: 24px 0 0;
        line-height: 1.6;
        color: #6e6e73;
      }
      .content p {
        margin: 0 0 10px;
      }
      .button {
        display: block;
        width: 220px;
        margin: 24px auto;
        padding: 13px 18px;
        text-align: center;
        background-color: #0071e3;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>重置企业名单工作台密码</h2>
      </div>
      <div class="content">
        <p>你好，</p>
        <p>
          我们收到了 {{ .Email }} 的密码重置请求。目前账号尚未发生任何修改。
        </p>
        <p>点击下方按钮设置新密码。该链接只应由你本人使用。</p>
        <p>
          <a href="{{ .ConfirmationURL }}" class="button">设置新密码</a>
        </p>
        <p>如果这不是你的操作，请忽略本邮件，并联系企业名单工作台管理员。</p>
        <p>企业名单工作台</p>
      </div>
    </div>
  </body>
</html>
